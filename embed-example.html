<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client page — widget embed example</title>
<style>body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;color:#222}</style>
</head>
<body>
<h1>Our recommended trading bots</h1>
<p>This is the client's own page. The block below is the widget, embedded as an iframe.</p>

<!-- Replace the src with your widget URL -->
<iframe id="ctrader-widget" src="./index.html?theme=auto&transparent=1"
        style="width:100%;border:0;min-height:600px" loading="lazy"
        title="Recommended cBots"></iframe>

<script>
window.addEventListener('message', function (e) {
  if (e.data && e.data.type === 'ctrader-widget:height') {
    document.getElementById('ctrader-widget').style.height = e.data.height + 'px';
  }
});
</script>
</body>
</html>
